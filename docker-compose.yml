services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    environment:
      FIT_USERNAME: ${FIT_USERNAME}
      FIT_PASSWORD: ${FIT_PASSWORD}
      WEBHOOK_URL: ${WEBHOOK_URL}
      IMPORTANT_WEBHOOK_URL: ${IMPORTANT_WEBHOOK_URL}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      IMGUR_CLIENT_ID: ${IMGUR_CLIENT_ID}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      INTERVAL: ${INTERVAL}
      DISCORD_ROLE_ID: ${DISCORD_ROLE_ID}
      DISCORD_IMPORTANT_ROLE_ID: ${DISCORD_IMPORTANT_ROLE_ID}
      STATE_DIR: /app/data
      SEEN_LIMIT: ${SEEN_LIMIT:-200}
      INITIAL_BACKFILL: ${INITIAL_BACKFILL:-1}
    volumes:
      - fit-notifier-data:/app/data

volumes:
  fit-notifier-data:
